<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c25"><meta name="description" content="FitTrack – latihan, kekuatan, berat dan pemakanan. Data disimpan pada peranti."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>FitTrack • Strength & Fat Loss</title><style>

n:14px 0}.chip{display:inline-block;border:1px solid var(--line);border-radius:100px;padding:4px 9px;font-size:12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c201b;border-top:1px solid var(--line);display:flex;justify-content:center;padding:5px max(5px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom))}.nav>button{flex:1;max-width:142px;padding:8px 2px;border-radius:10px;color:var(--muted);font-size:11px;background:transparent}.nav button.active{background:var(--panel2);color:var(--accent)}.nav span{display:block;font-size:20px;line-height:1.3}.hidden{display:none!important}.fieldrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.exercise{border-top:1px solid var(--line);padding:12px 0}.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin:7px 0}.sethead{font-size:11px;color:var(--muted)}.setrow input{padding:8px 5px;text-align:center}.setrow button{padding:8px 1px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.tabs button{white-space:nowrap}.tabs .active{background:var(--accent);color:var(--dark)}.item{border-bottom:1px solid var(--line);padding:10px 0}.item:last-child{border-bottom:0}.chart{width:100%;height:190px;background:#10261f;border-radius:12px;margin:10px 0}.notice{background:#20392b;border-left:3px solid var(--accent);padding:11px;border-radius:8px;color:#dcecd9}.warning{border-left-color:#efba72}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#182919;padding:11px 17px;border-radius:12px;z-index:50;display:none;max-width:90%}.toast.show{display:block}details{margin-top:10px}summary{cursor:pointer;color:var(--accent)}.strong{color:var(--accent);font-weight:750}.mr{margin-right:5px}@media(min-width:680px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:25px 26px 100px}.nav>button{font-size:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}@media(max-width:360px){.sethead,.setrow{grid-template-columns:22px 1fr 1fr 1fr 30px;gap:4px}.setrow input{padding:8px 1px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="logo">F</div><div><h1>FitTrack <span style="color:var(--accent)">3+1</span></h1><div class="small">Train smart • Track everything</div></div></div><span class="chip">Offline-ready</span></header><main id="app"></main></div><nav class="nav" id="nav"><button data-tab="home" class="active"><span>⌂</span>Home</button><button data-tab="workout"><span>▣</span>Workout</button><button data-tab="progress"><span>↗</span>Progress</button><button data-tab="food"><span>◉</span>Food</button><button data-tab="data"><span>⇩</span>Data</button></nav><div id="toast" class="toast" role="status"></div><script>

const catalogue=[

{id:'facepull',name:'Cable Face Pull',group:'Shoulders',movement:'Rear delt fly',type:'isolation',sets:2,lo:12,hi:15,rest:60,alternatives:['reversepec','reardb']},
{id:'reardb',name:'Bent-Over Rear Delt Raise',group:'Shoulders',movement:'Rear delt fly',type:'isolation',sets:2,lo:12,hi:15,rest:60,alternatives:['reversepec','facepull']}
];
const preset=[{id:'A',name:'Full Body A',subtitle:'Squat • Chest strength • Back',ids:['squat','bench','row','legcurl','lateral']},{id:'B',name:'Full Body B',subtitle:'Posterior chain • Back • Shoulders',ids:['rdl','pulldown','shoulder','legpress','crunch']},{id:'C',name:'Full Body C',subtitle:'Chest • Quads • Back hypertrophy',ids:['incline','legpress','supportedrow','legcurl','pecdeck']},{id:'D',name:'Optional Arms + Delts',subtitle:'Biceps • Triceps • Delts + cardio',ids:['curl','pushdown','lateral','reversepec']}];
const fresh=()=>({version:3,settings:{name:'',startKg:85,targetKg:80,protein:130,kcal:2100},customExercises:[],templates:[],sessions:[],body:[],food:[],active:null});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()};if(!db||typeof db!=='object')db=fresh();for(const [k,v] of Object.entries(fresh()))if(!(k in db))db[k]=v;
let tab='home', trendExercise='bench', progressMode='body', foodDate=TODAY(), mobileInstall=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allExercises=()=>[...catalogue,...db.customExercises];const getEx=id=>allExercises().find(x=>x.id===id);const templates=()=>[...preset,...db.templates];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage penuh atau disekat. Export JSON backup dan buka melalui GitHub Pages di Chrome. '+e.message);return false}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function num(n){return Number(n)||0}function fmt(n,d=1){return Number(n||0).toFixed(d).replace(/\.0$/,'')}
function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'})}
function nav(t){tab=t;render();scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});
function boxMetric(label,val,note=''){return `<div class="stat"><span class="small">${esc(label)}</span><b>${esc(val)}</b><span class="small">${esc(note)}</span></div>`}
function latestBody(){return [...db.body].sort((a,b)=>b.date.localeCompare(a.date))[0]}
function lastSession(){return [...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finished.localeCompare(a.finished))[0]}
function home(){let b=latestBody(),last=lastSession();let weeks=db.sessions.filter(s=>Date.now()-new Date(s.date+'T12:00:00').getTime()<7*864e5).length;return `<div class="card"><div class="small">YOUR FITNESS DASHBOARD</div><h2>Progress, bukan perfection 💪</h2><p class="muted">Pilih A, B, C atau optional ikut jadual kau. Tak terikat pada hari tertentu.</p><div class="stats">${boxMetric('Berat semasa',b?fmt(b.kg)+' kg':'—',`Target ${db.settings.targetKg} kg`)}${boxMetric('Sesi / 7 hari',weeks,'Sasaran 3–4')}${boxMetric('Jumlah sesi',db.sessions.length,'Workout selesai')}${boxMetric('Last workout',last?last.templateName:'—',last?dateText(last.date):'Belum ada')}</div></div>${db.active?`<div class="card notice"><b>Workout belum selesai</b><p>${esc(db.active.templateName)} · ${esc(db.active.date)}</p><button class="primary" onclick="nav('workout')">Sambung workout →</button></div>`:''}<h2>Mulakan sesi</h2><div class="grid">${templates().map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="small">${esc(t.subtitle||'Custom package')}</p><button class="primary" onclick="startWorkout('${esc(t.id)}')">Start ${esc(t.id)}</button></div>`).join('')}</div><div class="card notice"><b>Pelan latihan</b><p class="small">Minggu 1–2: 2 working sets/exercise, RIR 3–4. Minggu 3+: ikut program 2–3 sets, lazimnya RIR 2–3. Warm-up 5 min, angkat berat, kemudian 10 min cardio.</p></div>`}
function startWorkout(id){if(db.active&&!confirm('Workout yang belum selesai akan diganti. Teruskan?'))return;let t=templates().find(t=>t.id===id);if(!t)return;let ex=t.ids.map(id=>getEx(id)).filter(Boolean).map(x=>({exId:x.id,sets:Array.from({length:2},()=>({kg:'',reps:'',rir:'',done:false})),note:''}));db.active={id:uid(),date:TODAY(),templateId:id,templateName:t.name,exercises:ex,started:new Date().toISOString(),notes:''};save();nav('workout')}
function exerciseOptions(currentId){let x=getEx(currentId);if(!x)return '';let ids=[x.id,...(x.alternatives||[]),...allExercises().filter(y=>y.movement===x.movement&&y.group===x.group).map(y=>y.id)];return ids.filter((id,i)=>ids.indexOf(id)===i).map(id=>getEx(id)).filter(Boolean).map(a=>`<option value="${esc(a.id)}" ${a.id===currentId?'selected':''}>${esc(a.name)}</option>`).join('')}
function pastRecord(id){let sets=db.sessions.flatMap(s=>s.exercises.filter(e=>e.exId===id).flatMap(e=>e.sets.filter(x=>num(x.kg)>0&&num(x.reps)>0).map(x=>({...x,date:s.date}))));if(!sets.length)return '';sets.sort((a,b)=>b.date.localeCompare(a.date));return `${fmt(sets[0].kg)} kg × ${sets[0].reps} reps (${dateText(sets[0].date)})`}
function workout(){let a=db.active;return `<div class="row"><h2>Workout</h2><button class="outline" onclick="showPlans()">Packages & custom</button></div>${!a?`<div class="card"><h3>Tiada sesi aktif</h3><p class="muted">Pilih pakej mana-mana hari. A → C → B pun boleh. Beri recovery secukupnya.</p><div class="grid">${templates().map(t=>`<button class="primary" onclick="startWorkout('${esc(t.id)}')">${esc(t.name)}</button>`).join('')}</div></div>`: `<div class="card"><div class="row"><div><h2>${esc(a.templateName)}</h2><div class="small">${dateText(a.date)} · ${a.exercises.length} exercises</div></div><button class="danger outline" onclick="cancelWorkout()">Discard</button></div><label>Workout date</label><input type="date" value="${esc(a.date)}" onchange="activeField('date',this.value)"><div class="notice spaced small">Each set: berat (kg), repetitions, RIR. Untuk dumbbell, tulis berat <b>sebelah tangan</b>; kekalkan unit yang sama setiap kali.</div>${a.exercises.map((e,i)=>exerciseEditor(e,i)).join('')}<button class="outline spaced" onclick="showAddExercise()">+ Add exercise to this session</button><label>Workout notes</label><textarea rows="2" placeholder="Energy, pain, technique..." oninput="activeField('notes',this.value)">${esc(a.notes)}</textarea><div class="gap spaced"><button class="primary" onclick="finishWorkout()">✓ Finish & Save Workout</button><button class="outline" onclick="save();toast('Draft saved locally')">Save draft</button></div></div>`}<div class="card"><h3>Strength log</h3><p class="small">Selesai workout untuk lihat perkembangan setiap exercise pada tab Progress.</p></div>`}
function exerciseEditor(e,i){let x=getEx(e.exId);if(!x)return '';let last=pastRecord(e.exId);return `<section class="exercise"><div class="row"><div><b>${i+1}. ${esc(x.name)}</b><div class="small">${esc(x.group)} • ${esc(x.movement)} • ${x.lo}–${x.hi} reps • rest ${x.rest}s</div></div><button class="danger" aria-label="Remove exercise" onclick="removeExercise(${i})">×</button></div>${last?`<div class="small">Last: <span class="strong">${esc(last)}</span></div>`:''}<label>Swap ke latihan fungsi/otot sama</label><select onchange="swapExercise(${i},this.value)">${exerciseOptions(e.exId)}</select><div class="sethead"><div>Set</div><div>kg</div><div>Reps</div><div>RIR</div><div>Del</div></div>${e.sets.map((s,j)=>`<div class="setrow"><b>${j+1}</b><input inputmode="decimal" aria-label="Set ${j+1} weight kg" type="number" min="0" step="0.5" value="${esc(s.kg)}" oninput="updateSet(${i},${j},'kg',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} reps" type="number" min="0" max="100" step="1" value="${esc(s.reps)}" oninput="updateSet(${i},${j},'reps',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} RIR" type="number" min="0" max="10" step="1" value="${esc(s.rir)}" oninput="updateSet(${i},${j},'rir',this.value)"><button aria-label="Delete set" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<div class="gap"><button class="outline" onclick="addSet(${i})">+ Set</button><span class="small">Keep 2–4 RIR when returning to gym</span></div></section>`}
function activeField(f,v){db.active[f]=v;save()}function updateSet(i,j,f,v){db.active.exercises[i].sets[j][f]=v;save()}
function addSet(i){db.active.exercises[i].sets.push({kg:'',reps:'',rir:'',done:false});save();render()}
function removeSet(i,j){db.active.exercises[i].sets.splice(j,1);save();render()}
function removeExercise(i){if(confirm('Remove exercise dari sesi ini?')){db.active.exercises.splice(i,1);save();render()}}
function swapExercise(i,id){let old=db.active.exercises[i],from=getEx(old.exId),to=getEx(id);if(!to)return;if(from.id!==id){old.exId=id;old.sets=Array.from({length:Math.min(Math.max(old.sets.length,2),4)},()=>({kg:'',reps:'',rir:''}));save();render();toast('Swapped: '+to.name)}}
function cancelWorkout(){if(confirm('Discard workout draft? Data set yang belum finish akan hilang.')){db.active=null;save();render()}}
function finishWorkout(){let a=db.active;if(!a)return;let entries=a.exercises.flatMap(e=>e.sets).filter(s=>s.kg!==''&&s.reps!==''&&num(s.reps)>0);if(!entries.length){alert('Isi sekurang-kurangnya satu set dengan kg dan reps dahulu.');return}if(!confirm(`Simpan ${entries.length} set untuk ${a.templateName}?`))return;a.exercises=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.kg!==''&&s.reps!==''&&num(s.reps)>0).map(s=>({kg:num(s.kg),reps:num(s.reps),rir:s.rir===''?null:num(s.rir)}))})).filter(e=>e.sets.length);a.finished=new Date().toISOString();db.sessions.push(a);db.active=null;save();nav('progress');toast('Workout saved ✓')}
function showAddExercise(){let list=allExercises();modal(`<h3>Add exercise</h3><label>Choose from library</label><select id="pickex">${list.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.group)}</option>`).join('')}</select><div class="gap spaced"><button class="primary" onclick="appendExercise($('#pickex').value)">Add to session</button><button class="outline" onclick="showCustomExercise(true)">+ New exercise</button></div>`)}
function appendExercise(id){if(!db.active)return;let x=getEx(id);if(!x)return;db.active.exercises.push({exId:id,sets:[{kg:'',reps:'',rir:''},{kg:'',reps:'',rir:''}],note:''});save();closeModal();render()}
function showPlans(){modal(`<h3>Manage workout packages</h3><p class="small">Default A/B/C/Optional boleh dibuat pada mana-mana hari. Buat custom package untuk variasi kau sendiri.</p>${templates().map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><div class="gap"><button onclick="startWorkout('${esc(t.id)}');closeModal()">Start</button>${db.templates.some(z=>z.id===t.id)?`<button class="danger" onclick="deleteTemplate('${esc(t.id)}')">Delete</button>`:''}</div></div><div class="small">${t.ids.map(id=>getEx(id)?.name||id).join(' • ')}</div></div>`).join('')}<div class="spaced"><button class="primary" onclick="showNewTemplate()">+ Build custom package</button></div>`)}
function showNewTemplate(){modal(`<h3>New workout package</h3><label>Package name</label><input id="tname" placeholder="e.g. Upper body express"><label>Notes / focus</label><input id="tdesc" placeholder="Back + chest"><label>Select exercises (ordered; adjust by choosing order)</label><div id="choices">${allExercises().map(x=>`<label style="font-size:14px;color:var(--text)"><input type="checkbox" class="templateex" value="${esc(x.id)}" style="width:auto;margin-right:8px">${esc(x.name)} <span class="small">(${esc(x.group)})</span></label>`).join('')}</div><button class="primary" onclick="createTemplate()">Save package</button>`)}
function createTemplate(){let name=$('#tname').value.trim(),ids=[...document.querySelectorAll('.templateex:checked')].map(x=>x.value);if(!name||!ids.length){alert('Isi nama dan pilih exercise.');return}db.templates.push({id:'t'+uid(),name,subtitle:$('#tdesc').value,ids});save();closeModal();render();toast('Custom package created')}
function deleteTemplate(id){if(confirm('Delete custom package? Session lama tak terpadam.')){db.templates=db.templates.filter(t=>t.id!==id);save();showPlans()}}
function showCustomExercise(addNow=false){modal(`<h3>Create new exercise</h3><label>Exercise name</label><input id="ename" placeholder="e.g. Bulgarian split squat"><label>Main muscle group</label><select id="egroup">${['Quads','Hamstrings','Glutes','Chest','Back','Shoulders','Biceps','Triceps','Core','Calves','Other'].map(s=>`<option>${s}</option>`).join('')}</select><label>Movement pattern (untuk swap alternatives)</label><select id="emovement">${[...new Set(catalogue.map(x=>x.movement)),'Custom'].map(s=>`<option>${s}</option>`).join('')}</select><button class="primary spaced" onclick="createExercise(${addNow})">Save exercise</button>`)}
function createExercise(addNow){let name=$('#ename').value.trim();if(!name){alert('Isi nama exercise');return}let ex={id:'custom'+uid(),name,group:$('#egroup').value,movement:$('#emovement').value,type:'custom',sets:2,lo:8,hi:12,rest:90,alternatives:[]};db.customExercises.push(ex);if(addNow&&db.active)db.active.exercises.push({exId:ex.id,sets:[{kg:'',reps:'',rir:''},{kg:'',reps:'',rir:''}],note:''});save();closeModal();render();toast('Exercise added')}
function modal(html){let d=$('#modal');if(!d){d=document.createElement('div');d.id='modal';d.style='position:fixed;inset:0;background:#000b;z-index:30;overflow:auto;padding:30px 12px';document.body.append(d)}d.innerHTML=`<div style="max-width:620px;margin:auto;background:var(--panel);padding:18px;border-radius:17px;border:1px solid var(--line)"><div class="row"><b>FitTrack</b><button onclick="closeModal()">✕ Close</button></div><div class="spaced">${html}</div></div>`;d.classList.remove('hidden')}
function closeModal(){$('#modal')?.classList.add('hidden')}
function plot(points,key,title,unit=''){let filtered=points.filter(x=>Number.isFinite(num(x[key]))).sort((a,b)=>a.date.localeCompare(b.date));if(!filtered.length)return `<div class="notice">Belum ada data ${esc(title)}.</div>`;let vals=filtered.map(x=>num(x[key]));let low=Math.min(...vals),high=Math.max(...vals);if(high===low){high+=1;low-=1}let path=filtered.map((x,i)=>`${i?'L':'M'}${(35+i*300/Math.max(1,filtered.length-1)).toFixed(1)},${(160-(num(x[key])-low)/(high-low)*125).toFixed(1)}`).join(' ');let dots=filtered.map((x,i)=>`<circle cx="${35+i*300/Math.max(1,filtered.length-1)}" cy="${160-(num(x[key])-low)/(high-low)*125}" r="3.7" fill="#b5ed72"><title>${esc(dateText(x.date))}: ${fmt(x[key])}${unit}</title></circle>`).join('');return `<svg class="chart" role="img" aria-label="${esc(title)} trend" viewBox="0 0 370 190" preserveAspectRatio="none"><path d="M35 35V160H350" stroke="#517467" stroke-width="1.5" fill="none"/><path d="${path}" fill="none" stroke="#b5ed72" stroke-width="3" stroke-linejoin="round"/>${dots}<text x="4" y="39" fill="#b6c8be" font-size="11">${fmt(high)}${unit}</text><text x="4" y="161" fill="#b6c8be" font-size="11">${fmt(low)}${unit}</text></svg>`}
function bodyPanel(){let sorted=[...db.body].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h3>Log body measurements</h3><form onsubmit="addBody(event)"><div class="field3"><div><label>Date</label><input id="bodydate" type="date" value="${TODAY()}" required></div><div><label>Weight (kg)</label><input id="bodykg" type="number" inputmode="decimal" step="0.1" min="1" placeholder="85.0" required></div><div><label>Waist (cm)</label><input id="bodywaist" type="number" inputmode="decimal" step="0.1" min="1" placeholder="optional"></div></div><button class="primary spaced" type="submit">Save measurement</button></form>${plot(db.body,'kg','Weight','kg')}<div class="small">Berat paling berguna: ukur pagi dan bandingkan purata mingguan, bukan satu hari.</div>${sorted.slice(0,15).map(x=>`<div class="item row"><span>${dateText(x.date)}</span><span><b>${fmt(x.kg)} kg</b> ${x.waist?`· ${fmt(x.waist)} cm`:''}</span><button class="danger" onclick="deleteBody('${x.id}')">×</button></div>`).join('')}</div>`}
function addBody(e){e.preventDefault();let kg=num($('#bodykg').value);if(!(kg>0))return;db.body.push({id:uid(),date:$('#bodydate').value,kg,waist:$('#bodywaist').value?num($('#bodywaist').value):null});save();render();toast('Body measurement saved')}
function deleteBody(id){if(confirm('Delete body record?')){db.body=db.body.filter(b=>b.id!==id);save();render()}}
function histories(){let ids=[...new Set(db.sessions.flatMap(s=>s.exercises.map(e=>e.exId)))];let selector=allExercises().filter(x=>ids.includes(x.id));if(!selector.some(x=>x.id===trendExercise))trendExercise=selector[0]?.id||'bench';let points=db.sessions.flatMap(s=>s.exercises.filter(e=>e.exId===trendExercise).map(e=>{let good=e.sets.filter(s=>s.reps>0&&s.kg>=0);if(!good.length)return null;let best=good.reduce((a,b)=>Number(b.kg)>Number(a.kg)?b:a);let e1rm=Math.max(...good.map(z=>num(z.kg)*(1+Math.min(num(z.reps),12)/30)));return {date:s.date,kg:num(best.kg),reps:best.reps,rir:best.rir,e1rm,volume:good.reduce((sum,z)=>sum+num(z.kg)*num(z.reps),0),session:s.templateName}})).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));let best=points.length?Math.max(...points.map(x=>x.e1rm)):0;return `<div class="card"><h3>Exercise strength tracking</h3><p class="small">Track exercise yang sama dari sesi ke sesi. Untuk swap exercise, sejarah kedua-duanya disimpan berasingan.</p><label>Choose exercise</label><select onchange="trendExercise=this.value;render()">${selector.map(x=>`<option value="${esc(x.id)}" ${x.id===trendExercise?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${points.length?`<div class="stats spaced">${boxMetric('Latest top set',fmt(points[points.length-1].kg)+' kg',`${points[points.length-1].reps} reps`)}${boxMetric('Best estimated 1RM',fmt(best)+' kg','Anggaran, bukan ujian sebenar')}</div>${plot(points,'e1rm','Estimated 1RM','kg')}<div class="small">Estimated 1RM = kg × (1 + min(reps,12)/30); hanya anggaran dan kurang sesuai untuk reps tinggi atau mesin berbeza.</div>${[...points].reverse().slice(0,20).map(p=>`<div class="item row"><span>${dateText(p.date)} <span class="small">${esc(p.session)}</span></span><span><b>${fmt(p.kg)} kg × ${p.reps}</b><div class="small">e1RM ${fmt(p.e1rm)} kg</div></span></div>`).join('')}`:`<div class="notice spaced">Tiada history exercise lagi. Selesaikan workout dahulu.</div>`}</div>`}
function historyPanel(){return `<div class="card"><h3>Completed workouts (${db.sessions.length})</h3>${[...db.sessions].reverse().map(s=>`<details class="item"><summary>${dateText(s.date)} — ${esc(s.templateName)} · ${s.exercises.length} exercises</summary>${s.exercises.map(e=>`<div class="item"><b>${esc(getEx(e.exId)?.name||e.exId)}</b><div class="small">${e.sets.map(z=>`${fmt(z.kg)}kg × ${z.reps} reps${z.rir===null?'':` · RIR ${z.rir}`}`).join(' / ')}</div></div>`).join('')}<p class="small">${esc(s.notes)}</p><button class="danger" onclick="deleteSession('${s.id}')">Delete session</button></details>`).join('')||'<p class="muted">Belum ada sessions.</p>'}</div>`}
function deleteSession(id){if(confirm('Delete entire workout permanently?')){db.sessions=db.sessions.filter(s=>s.id!==id);save();render()}}
function progress(){return `<h2>Progress & Performance</h2><div class="tabs"><button class="${progressMode==='body'?'active':''}" onclick="progressMode='body';render()">Body weight</button><button class="${progressMode==='strength'?'active':''}" onclick="progressMode='strength';render()">Strength trend</button><button class="${progressMode==='history'?'active':''}" onclick="progressMode='history';render()">Workout history</button></div>${progressMode==='body'?bodyPanel():progressMode==='strength'?histories():historyPanel()}`}
function food(){let f=db.food.filter(f=>f.date===foodDate),cal=f.reduce((a,b)=>a+num(b.kcal),0),protein=f.reduce((a,b)=>a+num(b.protein),0);return `<h2>Nutrition</h2><div class="card"><label>Tracking date</label><input type="date" value="${foodDate}" onchange="foodDate=this.value;render()"><div class="stats spaced">${boxMetric('Calories',fmt(cal,0)+' kcal',`Manual target: ${db.settings.kcal}`)}${boxMetric('Protein',fmt(protein,0)+' g',`Target: ${db.settings.protein}g`)}</div><form onsubmit="addFood(event)"><label>Food / meal</label><input id="mealname" placeholder="e.g. Nasi + ayam" required><div class="fieldrow"><div><label>Calories (kcal)</label><input type="number" id="mealkcal" min="0" placeholder="500" required></div><div><label>Protein (g)</label><input type="number" id="mealprotein" min="0" step="0.1" placeholder="35" required></div></div><button class="primary spaced" type="submit">+ Add food</button></form><div class="small">Anggaran manual: aplikasi tidak menyemak kandungan nutrisi sebenar makanan. Kalori dan protein perlu diisi daripada label atau anggaran sendiri.</div>${f.map(x=>`<div class="item row"><span><b>${esc(x.name)}</b><div class="small">${x.kcal} kcal · ${x.protein}g protein</div></span><button class="danger" onclick="deleteFood('${x.id}')">×</button></div>`).join('')}</div>`}
function addFood(e){e.preventDefault();db.food.push({id:uid(),date:foodDate,name:$('#mealname').value.trim(),kcal:num($('#mealkcal').value),protein:num($('#mealprotein').value)});save();render();toast('Food saved')}
function deleteFood(id){db.food=db.food.filter(x=>x.id!==id);save();render()}
function csv(rows,columns){let quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+[columns.join(','),...rows.map(r=>columns.map(c=>quote(r[c])).join(','))].join('\r\n')}
function download(name,text,type='text/plain'){let b=new Blob([text],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportFile(type){let stamp=TODAY();if(type==='json')return download(`FitTrack_backup_${stamp}.json`,JSON.stringify(db,null,2),'application/json');let rows=[],columns=[];if(type==='workout'){columns=['date','package','exercise','muscle','movement','set','kg','reps','rir','estimated_1rm','volume_kg_reps','notes'];rows=db.sessions.flatMap(s=>s.exercises.flatMap(e=>e.sets.map((x,i)=>({date:s.date,package:s.templateName,exercise:getEx(e.exId)?.name||e.exId,muscle:getEx(e.exId)?.group||'',movement:getEx(e.exId)?.movement||'',set:i+1,kg:x.kg,reps:x.reps,rir:x.rir,estimated_1rm:(x.kg*(1+Math.min(x.reps,12)/30)).toFixed(1),volume_kg_reps:x.kg*x.reps,notes:s.notes}))))}else if(type==='body'){columns=['date','weight_kg','waist_cm'];rows=db.body.map(x=>({date:x.date,weight_kg:x.kg,waist_cm:x.waist}))}else if(type==='food'){columns=['date','food','kcal','protein_g'];rows=db.food.map(x=>({date:x.date,food:x.name,kcal:x.kcal,protein_g:x.protein}))}download(`FitTrack_${type}_${stamp}.csv`,csv(rows,columns),'text/csv;charset=utf-8')}
function importJSON(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!o||!Array.isArray(o.sessions)||!Array.isArray(o.body)||!Array.isArray(o.food)||!Array.isArray(o.customExercises)||!Array.isArray(o.templates))throw Error('Invalid FitTrack JSON');if(!confirm(`Restore backup: ${o.sessions.length} workouts, ${o.body.length} body records? This REPLACES current data. Export backup first.`))return;db={...fresh(),...o,settings:{...fresh().settings,...(o.settings||{})}};save();nav('home');toast('Backup restored')}catch(err){alert('Backup format tidak sah: '+err.message)}};reader.readAsText(file);e.target.value=''}
function saveSettings(e){e.preventDefault();for(let x of ['startKg','targetKg','protein','kcal'])db.settings[x]=num($('#setting_'+x).value);db.settings.name=$('#setting_name').value.trim();save();toast('Settings saved');render()}
function dataTab(){return `<h2>Data & Settings</h2><div class="card notice"><b>🔒 Data disimpan pada peranti ini sahaja</b><p class="small">LocalStorage untuk domain GitHub Pages kau. Tak ada account / cloud sync. Browser clear site data, incognito atau tukar phone boleh hilangkan data. Export JSON backup secara berkala. Data pada alamat localhost, file:// dan GitHub Pages ialah storage yang berasingan.</p></div><div class="card"><h3>Export untuk Excel / ChatGPT</h3><p class="small">CSV boleh dibuka terus dalam Excel. Download ketiga-tiganya dan upload kepada ChatGPT untuk semakan progres. JSON untuk backup lengkap termasuk custom exercises.</p><div class="gap"><button class="primary" onclick="exportFile('workout')">↓ Workout CSV</button><button onclick="exportFile('body')">↓ Body CSV</button><button onclick="exportFile('food')">↓ Food CSV</button><button onclick="exportFile('json')">↓ Full JSON Backup</button></div><h3 class="spaced">Restore backup</h3><input type="file" accept=".json,application/json" onchange="importJSON(event)"><p class="small">Restore akan menggantikan keseluruhan data sedia ada; export backup dahulu.</p></div><div class="card"><h3>My targets</h3><form onsubmit="saveSettings(event)"><label>Name (optional)</label><input id="setting_name" value="${esc(db.settings.name)}"><div class="fieldrow"><div><label>Start weight (kg)</label><input type="number" min="1" step="0.1" id="setting_startKg" value="${db.settings.startKg}"></div><div><label>Target weight (kg)</label><input type="number" min="1" step="0.1" id="setting_targetKg" value="${db.settings.targetKg}"></div><div><label>Protein target (g/day)</label><input type="number" min="0" id="setting_protein" value="${db.settings.protein}"></div><div><label>Calorie target (kcal/day)</label><input type="number" min="0" id="setting_kcal" value="${db.settings.kcal}"></div></div><button class="primary spaced" type="submit">Save targets</button></form><p class="small">Kalori adalah sasaran manual, bukan pengiraan keperluan individu secara automatik.</p></div><div class="card"><h3>Custom workouts & exercises</h3><div class="gap"><button onclick="showNewTemplate()">+ Custom package</button><button onclick="showCustomExercise(false)">+ Custom exercise</button><button onclick="showPlans()">View packages</button></div><p class="small">Custom exercise boleh ditambah ketika workout. Swap default menggunakan movement pattern yang hampir sama. Custom exercises boleh digunakan dalam custom package atau ditambah manual.</p></div><div class="card"><h3>Install on phone</h3><p class="small">Host melalui HTTPS (contohnya GitHub Pages), buka URL di Chrome Android, pilih ⋮ → Add to Home screen / Install app. Setelah dilawati sekali ketika online, majoriti app boleh digunakan offline. Jangan buka melalui 127.0.0.1.</p><button id="installbtn" onclick="installPWA()" ${mobileInstall?'':'disabled'}>Install app (jika tersedia)</button></div><div class="card"><button class="danger outline" onclick="clearAll()">Delete ALL local data</button></div>`}
function clearAll(){if(confirm('Delete ALL workout, body, nutrition and custom workouts?')&&confirm('Confirm permanently delete everything?')){db=fresh();save();nav('home')}}
async function installPWA(){if(mobileInstall){mobileInstall.prompt();await mobileInstall.userChoice;mobileInstall=null;render()}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();mobileInstall=e;if(tab==='data')render()});
function render(){$('#app').innerHTML=({home,workout,progress,food,data:dataTab})[tab]();document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn));
render();
</script></body></html>
