const fresh=()=>({version:3,settings:{name:'',startKg:85,targetKg:80,protein:130,kcal:2100},customExercises:[],templates:[],sessions:[],body:[],food:[],active:null});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()};if(!db||typeof db!=='object')db=fresh();for(const [k,v] of Object.entries(fresh()))if(!(k in db))db[k]=v;

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allExercises=()=>[...catalogue,...db.customExercises];const getEx=id=>allExercises().find(x=>x.id===id);const templates=()=>[...preset,...db.templates];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Storage penuh atau disekat. Export JSON backup dan buka melalui GitHub Pages di Chrome. '+e.message);return false}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function num(n){return Number(n)||0}function fmt(n,d=1){return Number(n||0).toFixed(d).replace(/\.0$/,'')}
function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric'})}
function nav(t){tab=t;render();scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)nav(b.dataset.tab)});
function boxMetric(label,val,note=''){return `<div class="stat"><span class="small">${esc(label)}</span><b>${esc(val)}</b><span class="small">${esc(note)}</span></div>`}
function latestBody(){return [...db.body].sort((a,b)=>b.date.localeCompare(a.date))[0]}
function lastSession(){return [...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.finished.localeCompare(a.finished))[0]}
function home(){let b=latestBody(),last=lastSession();let weeks=db.sessions.filter(s=>Date.now()-new Date(s.date+'T12:00:00').getTime()<7*864e5).length;return `<div class="card"><div class="small">YOUR FITNESS DASHBOARD</div><h2>Progress, bukan perfection 💪</h2><p class="muted">Pilih A, B, C atau optional ikut jadual kau. Tak terikat pada hari tertentu.</p><div class="stats">${boxMetric('Berat semasa',b?fmt(b.kg)+' kg':'—',`Target ${db.settings.targetKg} kg`)}${boxMetric('Sesi / 7 hari',weeks,'Sasaran 3–4')}${boxMetric('Jumlah sesi',db.sessions.length,'Workout selesai')}${boxMetric('Last workout',last?last.templateName:'—',last?dateText(last.date):'Belum ada')}</div></div>${db.active?`<div class="card notice"><b>Workout belum selesai</b><p>${esc(db.active.templateName)} · ${esc(db.active.date)}</p><button class="primary" onclick="nav('workout')">Sambung workout →</button></div>`:''}<h2>Mulakan sesi</h2><div class="grid">${templates().map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="small">${esc(t.subtitle||'Custom package')}</p><button class="primary" onclick="startWorkout('${esc(t.id)}')">Start ${esc(t.id)}</button></div>`).join('')}</div><div class="card notice"><b>Pelan latihan</b><p class="small">Minggu 1–2: 2 working sets/exercise, RIR 3–4. Minggu 3+: ikut program 2–3 sets, lazimnya RIR 2–3. Warm-up 5 min, angkat berat, kemudian 10 min cardio.</p></div>`}
function startWorkout(id){if(db.active&&!confirm('Workout yang belum selesai akan diganti. Teruskan?'))return;let t=templates().find(t=>t.id===id);if(!t)return;let ex=t.ids.map(id=>getEx(id)).filter(Boolean).map(x=>({exId:x.id,sets:Array.from({length:2},()=>({kg:'',reps:'',rir:'',done:false})),note:''}));db.active={id:uid(),date:TODAY(),templateId:id,templateName:t.name,exercises:ex,started:new Date().toISOString(),notes:''};save();nav('workout')}
function exerciseOptions(currentId){let x=getEx(currentId);if(!x)return '';let ids=[x.id,...(x.alternatives||[]),...allExercises().filter(y=>y.movement===x.movement&&y.group===x.group).map(y=>y.id)];return ids.filter((id,i)=>ids.indexOf(id)===i).map(id=>getEx(id)).filter(Boolean).map(a=>`<option value="${esc(a.id)}" ${a.id===currentId?'selected':''}>${esc(a.name)}</option>`).join('')}
function pastRecord(id){let sets=db.sessions.flatMap(s=>s.exercises.filter(e=>e.exId===id).flatMap(e=>e.sets.filter(x=>num(x.kg)>0&&num(x.reps)>0).map(x=>({...x,date:s.date}))));if(!sets.length)return '';sets.sort((a,b)=>b.date.localeCompare(a.date));return `${fmt(sets[0].kg)} kg × ${sets[0].reps} reps (${dateText(sets[0].date)})`}
function workout(){let a=db.active;return `<div class="row"><h2>Workout</h2><button class="outline" onclick="showPlans()">Packages & custom</button></div>${!a?`<div class="card"><h3>Tiada sesi aktif</h3><p class="muted">Pilih pakej mana-mana hari. A → C → B pun boleh. Beri recovery secukupnya.</p><div class="grid">${templates().map(t=>`<button class="primary" onclick="startWorkout('${esc(t.id)}')">${esc(t.name)}</button>`).join('')}</div></div>`: `<div class="card"><div class="row"><div><h2>${esc(a.templateName)}</h2><div class="small">${dateText(a.date)} · ${a.exercises.length} exercises</div></div><button class="danger outline" onclick="cancelWorkout()">Discard</button></div><label>Workout date</label><input type="date" value="${esc(a.date)}" onchange="activeField('date',this.value)"><div class="notice spaced small">Each set: berat (kg), repetitions, RIR. Untuk dumbbell, tulis berat <b>sebelah tangan</b>; kekalkan unit yang sama setiap kali.</div>${a.exercises.map((e,i)=>exerciseEditor(e,i)).join('')}<button class="outline spaced" onclick="showAddExercise()">+ Add exercise to this session</button><label>Workout notes</label><textarea rows="2" placeholder="Energy, pain, technique..." oninput="activeField('notes',this.value)">${esc(a.notes)}</textarea><div class="gap spaced"><button class="primary" onclick="finishWorkout()">✓ Finish & Save Workout</button><button class="outline" onclick="save();toast('Draft saved locally')">Save draft</button></div></div>`}<div class="card"><h3>Strength log</h3><p class="small">Selesai workout untuk lihat perkembangan setiap exercise pada tab Progress.</p></div>`}
function exerciseEditor(e,i){let x=getEx(e.exId);if(!x)return '';let last=pastRecord(e.exId);return `<section class="exercise"><div class="row"><div><b>${i+1}. ${esc(x.name)}</b><div class="small">${esc(x.group)} • ${esc(x.movement)} • ${x.lo}–${x.hi} reps • rest ${x.rest}s</div></div><button class="danger" aria-label="Remove exercise" onclick="removeExercise(${i})">×</button></div>${last?`<div class="small">Last: <span class="strong">${esc(last)}</span></div>`:''}<label>Swap ke latihan fungsi/otot sama</label><select onchange="swapExercise(${i},this.value)">${exerciseOptions(e.exId)}</select><div class="sethead"><div>Set</div><div>kg</div><div>Reps</div><div>RIR</div><div>Del</div></div>${e.sets.map((s,j)=>`<div class="setrow"><b>${j+1}</b><input inputmode="decimal" aria-label="Set ${j+1} weight kg" type="number" min="0" step="0.5" value="${esc(s.kg)}" oninput="updateSet(${i},${j},'kg',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} reps" type="number" min="0" max="100" step="1" value="${esc(s.reps)}" oninput="updateSet(${i},${j},'reps',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} RIR" type="number" min="0" max="10" step="1" value="${esc(s.rir)}" oninput="updateSet(${i},${j},'rir',this.value)"><button aria-label="Delete set" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<div class="gap"><button class="outline" onclick="addSet(${i})">+ Set</button><span class="small">Keep 2–4 RIR when returning to gym</span></div></section>`}
function activeField(f,v){db.active[f]=v;save()}function updateSet(i,j,f,v){db.active.exercises[i].sets[j][f]=v;save()}
function addSet(i){db.active.exercises[i].sets.push({kg:'',reps:'',rir:'',done:false});save();render()}
function removeSet(i,j){db.active.exercises[i].sets.splice(j,1);save();render()}
function removeExercise(i){if(confirm('Remove exercise dari sesi ini?')){db.active.exercises.splice(i,1);save();render()}}
function swapExercise(i,id){let old=db.active.exercises[i],from=getEx(old.exId),to=getEx(id);if(!to)return;if(from.id!==id){old.exId=id;old.sets=Array.from({length:Math.min(Math.max(old.sets.length,2),4)},()=>({kg:'',reps:'',rir:''}));save();render();toast('Swapped: '+to.name)}}
function cancelWorkout(){if(confirm('Discard workout draft? Data set yang belum finish akan hilang.')){db.active=null;save();render()}}
function finishWorkout(){let a=db.active;if(!a)return;let entries=a.exercises.flatMap(e=>e.sets).filter(s=>s.kg!==''&&s.reps!==''&&num(s.reps)>0);if(!entries.length){alert('Isi sekurang-kurangnya satu set dengan kg dan reps dahulu.');return}if(!confirm(`Simpan ${entries.length} set untuk ${a.templateName}?`))return;a.exercises=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.kg!==''&&s.reps!==''&&num(s.reps)>0).map(s=>({kg:num(s.kg),reps:num(s.reps),rir:s.rir===''?null:num(s.rir)}))})).filter(e=>e.sets.length);a.finished=new Date().toISOString();db.sessions.push(a);db.active=null;save();nav('progress');toast('Workout saved ✓')}
function showAddExercise(){let list=allExercises();modal(`<h3>Add exercise</h3><label>Choose from library</label><select id="pickex">${list.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.group)}</option>`).join('')}</select><div class="gap spaced"><button class="primary" onclick="appendExercise($('#pickex').value)">Add to session</button><button class="outline" onclick="showCustomExercise(true)">+ New exercise</button></div>`)}
function appendExercise(id){if(!db.active)return;let x=getEx(id);if(!x)return;db.active.exercises.push({exId:id,sets:[{kg:'',reps:'',rir:''},{kg:'',reps:'',rir:''}],note:''});save();closeModal();render()}

function modal(html){let d=$('#modal');if(!d){d=document.createElement('div');d.id='modal';d.style='position:fixed;inset:0;background:#000b;z-index:30;overflow:auto;padding:30px 12px';document.body.append(d)}d.innerHTML=`<div style="max-width:620px;margin:auto;background:var(--panel);padding:18px;border-radius:17px;border:1px solid var(--line)"><div class="row"><b>FitTrack</b><button onclick="closeModal()">✕ Close</button></div><div class="spaced">${html}</div></div>`;d.classList.remove('hidden')}

function plot(points,key,title,unit=''){let filtered=points.filter(x=>Number.isFinite(num(x[key]))).sort((a,b)=>a.date.localeCompare(b.date));if(!filtered.length)return `<div class="notice">Belum ada data ${esc(title)}.</div>`;let vals=filtered.map(x=>num(x[key]));let low=Math.min(...vals),high=Math.max(...vals);if(high===low){high+=1;low-=1}let path=filtered.map((x,i)=>`${i?'L':'M'}${(35+i*300/Math.max(1,filtered.length-1)).toFixed(1)},${(160-(num(x[key])-low)/(high-low)*125).toFixed(1)}`).join(' ');let dots=filtered.map((x,i)=>`<circle cx="${35+i*300/Math.max(1,filtered.length-1)}" cy="${160-(num(x[key])-low)/(high-low)*125}" r="3.7" fill="#b5ed72"><title>${esc(dateText(x.date))}: ${fmt(x[key])}${unit}</title></circle>`).join('');return `<svg class="chart" role="img" aria-label="${esc(title)} trend" viewBox="0 0 370 190" preserveAspectRatio="none"><path d="M35 35V160H350" stroke="#517467" stroke-width="1.5" fill="none"/><path d="${path}" fill="none" stroke="#b5ed72" stroke-width="3" stroke-linejoin="round"/>${dots}<text x="4" y="39" fill="#b6c8be" font-size="11">${fmt(high)}${unit}</text><text x="4" y="161" fill="#b6c8be" font-size="11">${fmt(low)}${unit}</text></svg>`}
function bodyPanel(){let sorted=[...db.body].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h3>Log body measurements</h3><form onsubmit="addBody(event)"><div class="field3"><div><label>Date</label><input id="bodydate" type="date" value="${TODAY()}" required></div><div><label>Weight (kg)</label><input id="bodykg" type="number" inputmode="decimal" step="0.1" min="1" placeholder="85.0" required></div><div><label>Waist (cm)</label><input id="bodywaist" type="number" inputmode="decimal" step="0.1" min="1" placeholder="optional"></div></div><button class="primary spaced" type="submit">Save measurement</button></form>${plot(db.body,'kg','Weight','kg')}<div class="small">Berat paling berguna: ukur pagi dan bandingkan purata mingguan, bukan satu hari.</div>${sorted.slice(0,15).map(x=>`<div class="item row"><span>${dateText(x.date)}</span><span><b>${fmt(x.kg)} kg</b> ${x.waist?`· ${fmt(x.waist)} cm`:''}</span><button class="danger" onclick="deleteBody('${x.id}')">×</button></div>`).join('')}</div>`}

function histories(){let ids=[...new Set(db.sessions.flatMap(s=>s.exercises.map(e=>e.exId)))];let selector=allExercises().filter(x=>ids.includes(x.id));if(!selector.some(x=>x.id===trendExercise))trendExercise=selector[0]?.id||'bench';let points=db.sessions.flatMap(s=>s.exercises.filter(e=>e.exId===trendExercise).map(e=>{let good=e.sets.filter(s=>s.reps>0&&s.kg>=0);if(!good.length)return null;let best=good.reduce((a,b)=>Number(b.kg)>Number(a.kg)?b:a);let e1rm=Math.max(...good.map(z=>num(z.kg)*(1+Math.min(num(z.reps),12)/30)));return {date:s.date,kg:num(best.kg),reps:best.reps,rir:best.rir,e1rm,volume:good.reduce((sum,z)=>sum+num(z.kg)*num(z.reps),0),session:s.templateName}})).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));let best=points.length?Math.max(...points.map(x=>x.e1rm)):0;return `<div class="card"><h3>Exercise strength tracking</h3><p class="small">Track exercise yang sama dari sesi ke sesi. Untuk swap exercise, sejarah kedua-duanya disimpan berasingan.</p><label>Choose exercise</label><select onchange="trendExercise=this.value;render()">${selector.map(x=>`<option value="${esc(x.id)}" ${x.id===trendExercise?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${points.length?`<div class="stats spaced">${boxMetric('Latest top set',fmt(points[points.length-1].kg)+' kg',`${points[points.length-1].reps} reps`)}${boxMetric('Best estimated 1RM',fmt(best)+' kg','Anggaran, bukan ujian sebenar')}</div>${plot(points,'e1rm','Estimated 1RM','kg')}<div class="small">Estimated 1RM = kg × (1 + min(reps,12)/30); hanya anggaran dan kurang sesuai untuk reps tinggi atau mesin berbeza.</div>${[...points].reverse().slice(0,20).map(p=>`<div class="item row"><span>${dateText(p.date)} <span class="small">${esc(p.session)}</span></span><span><b>${fmt(p.kg)} kg × ${p.reps}</b><div class="small">e1RM ${fmt(p.e1rm)} kg</div></span></div>`).join('')}`:`<div class="notice spaced">Tiada history exercise lagi. Selesaikan workout dahulu.</div>`}</div>`}
function historyPanel(){return `<div class="card"><h3>Completed workouts (${db.sessions.length})</h3>${[...db.sessions].reverse().map(s=>`<details class="item"><summary>${dateText(s.date)} — ${esc(s.templateName)} · ${s.exercises.length} exercises</summary>${s.exercises.map(e=>`<div class="item"><b>${esc(getEx(e.exId)?.name||e.exId)}</b><div class="small">${e.sets.map(z=>`${fmt(z.kg)}kg × ${z.reps} reps${z.rir===null?'':` · RIR ${z.rir}`}`).join(' / ')}</div></div>`).join('')}<p class="small">${esc(s.notes)}</p><button class="danger" onclick="deleteSession('${s.id}')">Delete session</button></details>`).join('')||'<p class="muted">Belum ada sessions.</p>'}</div>`}

function csv(rows,columns){let quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+[columns.join(','),...rows.map(r=>columns.map(c=>quote(r[c])).join(','))].join('\r\n')}
function download(name,text,type='text/plain'){let b=new Blob([text],{type}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportFile(type){let stamp=TODAY();if(type==='json')return download(`FitTrack_backup_${stamp}.json`,JSON.stringify(db,null,2),'application/json');let rows=[],columns=[];if(type==='workout'){columns=['session_id','date','package','exercise','muscle','movement','set','kg','reps','rir','estimated_1rm','volume_kg_reps','notes'];rows=db.sessions.flatMap(s=>s.exercises.flatMap(e=>e.sets.map((x,i)=>({session_id:s.id,date:s.date,package:s.templateName,exercise:getEx(e.exId)?.name||e.exId,muscle:getEx(e.exId)?.group||'',movement:getEx(e.exId)?.movement||'',set:i+1,kg:x.kg,reps:x.reps,rir:x.rir,estimated_1rm:(x.kg*(1+Math.min(x.reps,12)/30)).toFixed(1),volume_kg_reps:x.kg*x.reps,notes:s.notes}))))}else if(type==='body'){columns=['date','weight_kg','waist_cm'];rows=db.body.map(x=>({date:x.date,weight_kg:x.kg,waist_cm:x.waist}))}else if(type==='food'){columns=['date','food','kcal','protein_g'];rows=db.food.map(x=>({date:x.date,food:x.name,kcal:x.kcal,protein_g:x.protein}))}download(`FitTrack_${type}_${stamp}.csv`,csv(rows,columns),'text/csv;charset=utf-8')}
function importJSON(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!o||!Array.isArray(o.sessions)||!Array.isArray(o.body)||!Array.isArray(o.food)||!Array.isArray(o.customExercises)||!Array.isArray(o.templates))throw Error('Invalid FitTrack JSON');if(!confirm(`Restore backup: ${o.sessions.length} workouts, ${o.body.length} body records? This REPLACES current data. Export backup first.`))return;db={...fresh(),...o,settings:{...fresh().settings,...(o.settings||{})}};save();nav('home');toast('Backup restored')}catch(err){alert('Backup format tidak sah: '+err.message)}};reader.readAsText(file);e.target.value=''}

function dataTab(){return `<h2>Data & Settings</h2><div class="card notice"><b>🔒 Data disimpan pada peranti ini sahaja</b><p class="small">LocalStorage untuk domain GitHub Pages kau. Tak ada account / cloud sync. Browser clear site data, incognito atau tukar phone boleh hilangkan data. Export JSON backup secara berkala. Data pada alamat localhost, file:// dan GitHub Pages ialah storage yang berasingan.</p></div><div class="card"><h3>Export untuk Excel / ChatGPT</h3><p class="small">CSV boleh dibuka terus dalam Excel. Download ketiga-tiganya dan upload kepada ChatGPT untuk semakan progres. JSON untuk backup lengkap termasuk custom exercises.</p><div class="gap"><button class="primary" onclick="exportFile('workout')">↓ Workout CSV</button><button onclick="exportFile('body')">↓ Body CSV</button><button onclick="exportFile('food')">↓ Food CSV</button><button onclick="exportFile('json')">↓ Full JSON Backup</button></div><h3 class="spaced">Restore backup</h3><input type="file" accept=".json,application/json" onchange="importJSON(event)"><p class="small">Restore akan menggantikan keseluruhan data sedia ada; export backup dahulu.</p></div><div class="card"><h3>My targets</h3><form onsubmit="saveSettings(event)"><label>Name (optional)</label><input id="setting_name" value="${esc(db.settings.name)}"><div class="fieldrow"><div><label>Start weight (kg)</label><input type="number" min="1" step="0.1" id="setting_startKg" value="${db.settings.startKg}"></div><div><label>Target weight (kg)</label><input type="number" min="1" step="0.1" id="setting_targetKg" value="${db.settings.targetKg}"></div><div><label>Protein target (g/day)</label><input type="number" min="0" id="setting_protein" value="${db.settings.protein}"></div><div><label>Calorie target (kcal/day)</label><input type="number" min="0" id="setting_kcal" value="${db.settings.kcal}"></div></div><button class="primary spaced" type="submit">Save targets</button></form><p class="small">Kalori adalah sasaran manual, bukan pengiraan keperluan individu secara automatik.</p></div><div class="card"><h3>Custom workouts & exercises</h3><div class="gap"><button onclick="showNewTemplate()">+ Custom package</button><button onclick="showCustomExercise(false)">+ Custom exercise</button><button onclick="showPlans()">View packages</button></div><p class="small">Custom exercise boleh ditambah ketika workout. Swap default menggunakan movement pattern yang hampir sama. Custom exercises boleh digunakan dalam custom package atau ditambah manual.</p></div><div class="card"><h3>Install on phone</h3><p class="small">Host melalui HTTPS (contohnya GitHub Pages), buka URL di Chrome Android, pilih ⋮ → Add to Home screen / Install app. Setelah dilawati sekali ketika online, majoriti app boleh digunakan offline. Jangan buka melalui 127.0.0.1.</p><button id="installbtn" onclick="installPWA()" ${mobileInstall?'':'disabled'}>Install app (jika tersedia)</button></div><div class="card"><button class="danger outline" onclick="clearAll()">Delete ALL local data</button></div>`}

function imgSource(x,position='start') {
  if(!x)return '';
  if(RESOLVED_IMAGES[x.id])return 'https://exercise-dataset.com/'+(RESOLVED_IMAGES[x.id][position]||RESOLVED_IMAGES[x.id].start||RESOLVED_IMAGES[x.id].main);
  if(!VISUAL_IDS[x.id])return '';
  return 'https://exercise-dataset.com/images/flat/'+encodeURIComponent(VISUAL_IDS[x.id])+'-'+position+'.webp';
}
async function resolveImageReferences(){
  if(!navigator.onLine||Object.keys(RESOLVED_IMAGES).length>=95)return;
  try {
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);
    let response=await fetch('https://exercise-dataset.com/exercises.json',{signal:controller.signal,mode:'cors'});clearTimeout(timer);
    if(!response.ok)throw Error('references unavailable');
    let json=await response.json(),entries=Array.isArray(json.exercises)?json.exercises:[];
    const lookup=new Map(entries.map(x=>[normalizeExerciseName(x.name_en),x]));
    for(let ex of allExercises()){
      let ref=lookup.get(normalizeExerciseName(ex.name));if(!ref?.images?.flat)continue;
      let m=ref.images.flat;
      RESOLVED_IMAGES[ex.id]={start:m.start||m.main,peak:m.peak||m.start||m.main};
    }
    localStorage.setItem(EX_IMAGE_KEY,JSON.stringify(RESOLVED_IMAGES));
    document.querySelectorAll('.ex-visual[data-ex-id]').forEach(el=>{let id=el.dataset.exId,x=getEx(id),src=imgSource(x);let img=el.querySelector('img');if(img&&src&&img.src!==src){el.classList.remove('broken');img.src=src}});
  }catch(err){console.info('Reference images fallback mode:',err?.message||err)}
}

 return `<button type="button" class="ex-visual ${src?'':'broken'}" data-ex-id="${esc(x.id)}" aria-label="${esc(ariaLabel)}: ${esc(x.name)}" onclick="showExerciseInfo('${esc(x.id)}')">${src?`<img loading="lazy" src="${src}" alt="Ilustrasi ${esc(x.name)}" onerror="this.closest('.ex-visual').classList.add('broken')">`:''}<span class="image-fallback">${fallback}<small>Reference ↗</small></span></button>`;

 const title=`<h3>${esc(x.name)}</h3>${muscleTags(x)}<p class="small">${esc(x.movement)} · ${esc(x.type)} · ${x.lo}–${x.hi} reps · ${x.rest}s rest</p>`;
 const haveImage=!!imgSource(x);
 let pics=haveImage?`<div class="img-pair"><figure><img loading="lazy" src="${imgSource(x)}" alt="Start ${esc(x.name)}" onerror="this.style.opacity=.15"><figcaption>Start position</figcaption></figure><figure><img loading="lazy" src="${imgSource(x,'peak')}" alt="Peak ${esc(x.name)}" onerror="this.style.opacity=.15"><figcaption>Peak position</figcaption></figure></div>`:`<p class="notice">Custom exercise: tiada gambar terbina. Boleh buka Google Images untuk rujukan.</p>`;
 const previous=pastRecord(id);
 modal(`${title}${pics}<p class="small spaced">Gambar rujukan luaran (RepDB), bukan arahan teknik penuh. Rujuk jurulatih jika tak pasti.</p>${previous?`<p class="notice">Last log: <b>${esc(previous)}</b></p>`:''}<div class="gap spaced"><a href="${googlePhotos(x)}" target="_blank" rel="noopener noreferrer">Google Images ↗</a>${haveImage?`<a href="${repdbPage(x)}" target="_blank" rel="noopener noreferrer">Exercise details ↗</a>`:''}</div><button class="outline" onclick="closeModal()">Close</button>`);
}
function library(){
 let list=allExercises().filter(x=>(libraryGroup==='All'||x.group===libraryGroup)&&(libraryType==='All'||x.type===libraryType)&&(`${x.name} ${x.group} ${x.movement}`.toLowerCase().includes(libraryFilter.toLowerCase())));
 return `<div class="library-top"><div><h2>Exercise Library</h2><p class="small">${list.length} matching · ${allExercises().length} total</p></div><button class="outline" onclick="showCustomExercise(false)">+ Custom</button></div><div class="card"><label>Search exercise / muscle</label><input id="librarySearch" placeholder="e.g. bench, hamstring, rear delt" value="${esc(libraryFilter)}" oninput="filterLibrary(this.value)"><div class="filterbar"><div><label>Body area</label><select onchange="libraryGroup=this.value;libraryLimit=36;render()">${GROUPS.map(g=>`<option ${g===libraryGroup?'selected':''}>${g}</option>`).join('')}</select></div><div><label>Type</label><select onchange="libraryType=this.value;libraryLimit=36;render()"><option ${libraryType==='All'?'selected':''}>All</option><option ${libraryType==='compound'?'selected':''}>compound</option><option ${libraryType==='isolation'?'selected':''}>isolation</option></select></div></div></div><div class="library-grid">${list.slice(0,libraryLimit).map(x=>`<div class="ex-card library-card">${imageTile(x)}<div>${muscleTags(x)}</div><h3>${esc(x.name)}</h3><div class="small">${esc(x.movement)} · ${x.lo}–${x.hi} reps</div><button class="outline" onclick="showExerciseInfo('${esc(x.id)}')">View technique</button></div>`).join('')}</div>${list.length>libraryLimit?`<button class="outline spaced" onclick="libraryLimit+=36;render()">Load more (${list.length-libraryLimit} remaining)</button>`:''}<div class="card small">Exercise illustrations: <a href="https://repdb.co" target="_blank" rel="noopener">Exercise data by RepDB (repdb.co)</a>. Images require internet; use Google Images links if a thumbnail is unavailable. Sources are provided for reference, not for clinical guidance.</div>`;
}
function filterLibrary(val){ libraryFilter=val;libraryLimit=36;let field=document.activeElement;const begin=field?.selectionStart;render();const input=$('#librarySearch');if(input){input.focus();try{input.setSelectionRange(begin,begin)}catch{}} }
function exerciseEditor(e,i){
 let x=getEx(e.exId);if(!x)return '';let last=pastRecord(e.exId);
 return `<section class="exercise"><div class="exercise-hero">${imageTile(x)}<div><div class="row"><b class="ex-title">${i+1}. ${esc(x.name)}</b><button class="danger" aria-label="Remove exercise" onclick="removeExercise(${i})">×</button></div>${muscleTags(x)}<p class="ex-desc">${esc(x.movement)} · ${x.lo}–${x.hi} reps · rest ${x.rest}s · ${esc(x.type)}</p><button class="outline mini" onclick="showExerciseInfo('${esc(x.id)}')">📷 Lihat gambar / technique</button></div></div>${last?`<div class="notice small">Last session: <b>${esc(last)}</b></div>`:''}<label>Swap exercise — target sama / gerakan seakan</label><select aria-label="Swap ${esc(x.name)}" onchange="swapExercise(${i},this.value)">${exerciseOptions(e.exId)}</select><div class="sethead"><div>Set</div><div>kg</div><div>Reps</div><div>RIR</div><div>Del</div></div>${e.sets.map((z,j)=>`<div class="setrow"><b>${j+1}</b><input inputmode="decimal" aria-label="Set ${j+1} weight kg" type="number" min="0" step="0.5" value="${esc(z.kg)}" oninput="updateSet(${i},${j},'kg',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} reps" type="number" min="0" max="100" step="1" value="${esc(z.reps)}" oninput="updateSet(${i},${j},'reps',this.value)"><input inputmode="numeric" aria-label="Set ${j+1} RIR" type="number" min="0" max="10" step="1" value="${esc(z.rir)}" oninput="updateSet(${i},${j},'rir',this.value)"><button aria-label="Delete set" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<div class="gap"><button class="outline" onclick="addSet(${i})">+ Set</button><span class="small">Week 1–2: RIR 3–4 · dumbbells: kg per hand</span></div></section>`;
}
function showAddExercise(){
 const list=allExercises().sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));
 modal(`<h3>Add exercise to this session</h3><p class="small">Pilih berdasarkan otot. Boleh tambah exercise sendiri juga.</p><label>Exercise</label><select id="pickex">${list.map(x=>`<option value="${esc(x.id)}">${esc(x.group)} · ${esc(x.name)}</option>`).join('')}</select><div class="gap spaced"><button class="primary" onclick="appendExercise($('#pickex').value)">Add to session</button><button class="outline" onclick="showCustomExercise(true)">+ Custom exercise</button></div>`);
}
function csvParse(text){
 text=String(text||'').replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false}else cell+=c;}else if(c==='"'){quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.length))rows.push(row);row=[];cell=''}else cell+=c;}
 if(quoted)throw Error('CSV quote tidak ditutup');if(row.length||cell){row.push(cell);rows.push(row)}if(!rows.length)return [];
 const headers=rows.shift().map(x=>x.trim().toLowerCase());return rows.map(row=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??''])));
}
function normalizeExerciseName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
function findExerciseByName(name){let v=normalizeExerciseName(name);return allExercises().find(x=>normalizeExerciseName(x.name)===v)||allExercises().find(x=>normalizeExerciseName(x.name).replace('flat','')===v.replace('flat',''));}
function legacySignature(item){
 let data=JSON.stringify(item);let h=2166136261;for(let i=0;i<data.length;i++){h^=data.charCodeAt(i);h=Math.imul(h,16777619)}return 'sig'+(h>>>0).toString(36);
}
function importCSVfiles(e){
 let files=[...(e.target.files||[])];if(!files.length)return;
 Promise.all(files.map(async file=>({name:file.name,rows:csvParse(await file.text())}))).then(data=>{
  const summary=data.map(d=>`${d.name}: ${d.rows.length} rows`).join('\n');
  if(!confirm('Import CSV lama dengan MERGE (tidak padam data semasa)?\n\n'+summary+'\n\nSebaiknya export JSON Backup dahulu.'))return;
  const report={workouts:0,body:0,food:0,skipped:0};
  const known=new Set(db.importHistory||[]);
  for(const {name,rows} of data){if(!rows.length)continue;
   const headers=Object.keys(rows[0]);let type=headers.includes('exercise')&&headers.includes('reps')?'workout':headers.includes('weight_kg')?'body':headers.includes('food')&&headers.includes('protein_g')?'food':null;
   if(!type){alert('CSV tidak dikenali: '+name);continue;}
   if(type==='body') for(const r of rows){let entry={date:r.date,kg:num(r.weight_kg),waist:r.waist_cm?num(r.waist_cm):null};if(!/^\d{4}-\d\d-\d\d$/.test(entry.date)||!(entry.kg>0))continue;
      let sig=legacySignature(['body',entry]);if(known.has(sig)||db.body.some(b=>b.date===entry.date&&num(b.kg)===entry.kg&&num(b.waist)===num(entry.waist))){report.skipped++;continue;}db.body.push({id:uid(),...entry});known.add(sig);report.body++;
   }
   if(type==='food') for(const r of rows){let entry={date:r.date,name:r.food,kcal:num(r.kcal),protein:num(r.protein_g)};if(!entry.name||!entry.date)continue;
      let sig=legacySignature(['food',entry]);if(known.has(sig)||db.food.some(f=>f.date===entry.date&&f.name===entry.name&&num(f.kcal)===entry.kcal&&num(f.protein)===entry.protein)){report.skipped++;continue;}db.food.push({id:uid(),...entry});known.add(sig);report.food++;
   }
   if(type==='workout') {
     const grouped=new Map();
     for(const r of rows){if(!r.date||!r.exercise||!(num(r.reps)>0))continue;let groupKey=r.session_id||[r.date,r.package,r.notes].join('|');if(!grouped.has(groupKey))grouped.set(groupKey,[]);grouped.get(groupKey).push(r);}
     for(const [groupKey,ss] of grouped){
       const signature=legacySignature(['workout',ss.map(x=>[x.date,x.package,x.exercise,x.set,x.kg,x.reps,x.rir,x.notes])]);
       if(known.has(signature)||db.sessions.some(s=>s.importSignature===signature||sessionMatchesCSV(s,ss))){report.skipped++;continue;}
       const first=ss[0], exGroups=new Map();
       for(const r of ss){let ex=findExerciseByName(r.exercise);if(!ex){let id='imported_'+legacySignature(r.exercise);ex=getEx(id);if(!ex){ex={id,name:r.exercise,group:r.muscle||'Other',movement:r.movement||'Custom',type:'compound',sets:2,lo:8,hi:12,rest:90,alternatives:[]};db.customExercises.push(ex)}}
        if(!exGroups.has(ex.id))exGroups.set(ex.id,[]);exGroups.get(ex.id).push({kg:num(r.kg),reps:num(r.reps),rir:r.rir===''?null:num(r.rir)});
       }
       const entry={id:uid(),date:first.date,templateId:'legacy',templateName:first.package||'Imported workout',notes:first.notes||'',started:first.date+'T12:00:00',finished:first.date+'T13:00:00',exercises:[...exGroups.entries()].map(([exId,sets])=>({exId,sets,note:''})),importSignature:signature};
       db.sessions.push(entry);known.add(signature);report.workouts++;
     }
   }
  }
  db.importHistory=[...known];if(save()){render();alert(`Import selesai.\nWorkout: ${report.workouts}\nBody: ${report.body}\nFood: ${report.food}\nSkipped duplicates: ${report.skipped}`)}
 }).catch(err=>alert('CSV import gagal: '+err.message)).finally(()=>{e.target.value=''});
}
function importJSONMerge(e){
 const file=e.target.files?.[0];if(!file)return;
 file.text().then(txt=>{
  let incoming=JSON.parse(txt);if(!incoming||!Array.isArray(incoming.sessions)||!Array.isArray(incoming.body)||!Array.isArray(incoming.food)||!Array.isArray(incoming.customExercises)||!Array.isArray(incoming.templates))throw Error('Bukan FitTrack JSON yang sah');
  if(!confirm(`Merge backup lama?\n${incoming.sessions.length} workouts, ${incoming.body.length} body logs, ${incoming.food.length} food logs.\n\nData semasa KEKAL. Rekod dengan ID sama akan diabaikan.`))return;
  const old=JSON.stringify(db);let counts={};
  for(const key of ['customExercises','templates','sessions','body','food']){
   const have=new Set(db[key].map(x=>x.id));let count=0;
   for(const record of incoming[key])if(record&&typeof record==='object'&&record.id&&!have.has(record.id)){
    db[key].push(record);have.add(record.id);count++;
   }
   counts[key]=count;
  }
  db.importHistory=[...new Set([...(db.importHistory||[]),...(incoming.importHistory||[])])];
  if(!save()){db=JSON.parse(old);return;}
  render();alert('Merge selesai (tanpa padam rekod lama):\n'+Object.entries(counts).map(([k,v])=>k+': +'+v).join('\n'));
 }).catch(err=>alert('Import JSON gagal: '+err.message)).finally(()=>{e.target.value=''});
}
function exportLegacySnapshot(){let old=localStorage.getItem(LEGACY_SNAPSHOT_KEY);if(!old)return alert('Tiada snapshot old version pada browser ini. Export Full JSON Backup sahaja.');download('FitTrack_before_v4_snapshot.json',old,'application/json')}
function dataTab(){return `<h2>Data, Backup & Migration</h2><div class="card notice"><b>🔒 Rekod lama kekal</b><p class="small">App v4 kekalkan storage key asal <code>fittrack_v3_local_2026</code>. Jika GitHub Pages URL, browser dan peranti sama, rekod lama patut muncul sendiri. Snapshot sebelum v4 disimpan di key tambahan jika tersedia.</p><p class="small warning-text">PENTING: Jika dulu guna localhost, file://, browser lain atau domain lain, data tidak boleh dibaca automatik. Guna JSON Backup atau Import CSV di bawah.</p></div>
 <div class="card"><h3>1. Export sekarang (buat sebelum update)</h3><p class="small">Untuk restore sempurna, JSON Backup lebih selamat daripada CSV. CSV lama tiada session ID, jadi import workout akan digabung mengikut tarikh + package.</p><div class="gap"><button class="primary" onclick="exportFile('json')">↓ Full JSON Backup</button><button class="outline" onclick="exportLegacySnapshot()">↓ Pre-v4 snapshot</button></div><div class="gap spaced"><button onclick="exportFile('workout')">↓ Workout CSV</button><button onclick="exportFile('body')">↓ Body CSV</button><button onclick="exportFile('food')">↓ Food CSV</button></div></div>
 <div class="card"><h3>2. Import rekod lama (MERGE)</h3><div class="dropzone"><b>Import old CSV</b><p class="small">Pilih 1–3 CSV daripada versi lama sekaligus: Workout, Body, Food. App akan cuba kesan jenis fail, gabungkan ke rekod semasa dan skip duplicate.</p><input type="file" multiple accept=".csv,text/csv" aria-label="Import old FitTrack CSV files" onchange="importCSVfiles(event)"></div><div class="dropzone"><b>Import old JSON Backup</b><p class="small">Disyorkan. Merge rekod berdasarkan ID tanpa menggantikan data semasa.</p><input type="file" accept=".json,application/json" aria-label="Merge FitTrack JSON backup" onchange="importJSONMerge(event)"></div><details><summary>Restore keseluruhan (REPLACE) — advanced</summary><div class="migration-banner small">Ini akan MENGGANTIKAN semua rekod. Jangan guna untuk upgrade biasa. Export Full JSON dahulu.</div><input type="file" accept=".json,application/json" onchange="importJSON(event)"></details></div>
 <div class="card"><h3>Local storage status</h3>${boxMetric('Completed workouts',db.sessions.length,'Disimpan dalam browser')}${boxMetric('Body records',db.body.length,'')}${boxMetric('Food records',db.food.length,'')}${boxMetric('Custom exercises',db.customExercises.length,'')}<p class="small spaced">Data tersimpan pada origin/domain browser, bukan GitHub server. Clear site data atau tukar telefon tanpa backup akan hilangkan rekod.</p></div>
 <div class="card"><h3>My targets</h3><form onsubmit="saveSettings(event)"><label>Name (optional)</label><input id="setting_name" value="${esc(db.settings.name)}"><div class="fieldrow"><div><label>Starting weight (kg)</label><input type="number" min="1" step="0.1" id="setting_startKg" value="${db.settings.startKg}"></div><div><label>Target weight (kg)</label><input type="number" min="1" step="0.1" id="setting_targetKg" value="${db.settings.targetKg}"></div><div><label>Protein target (g/day)</label><input type="number" min="0" id="setting_protein" value="${db.settings.protein}"></div><div><label>Calorie target (kcal/day)</label><input type="number" min="0" id="setting_kcal" value="${db.settings.kcal}"></div></div><button class="primary spaced" type="submit">Save targets</button></form></div>
 <div class="card"><h3>Custom workouts & exercise</h3><div class="gap"><button onclick="showNewTemplate()">+ Package</button><button onclick="showCustomExercise(false)">+ Exercise</button><button onclick="showPlans()">View packages</button></div></div>
 <div class="card"><h3>Install / Update PWA</h3><p class="small">Host ke GitHub Pages HTTPS, buka URL yang SAMA seperti sebelumnya. Jika masih nampak versi lama selepas upload, refresh atau tutup dan buka semula app. Update service worker memerlukan sedikit masa untuk diaktifkan.</p><button id="installbtn" onclick="installPWA()" ${mobileInstall?'':'disabled'}>Install app (jika tersedia)</button></div>
 <div class="card"><h3>Exercise image credits</h3><p class="small"><a target="_blank" rel="noopener noreferrer" href="https://repdb.co">Exercise data by RepDB (repdb.co)</a>. Pautan gambar memerlukan internet; Google Images disediakan untuk rujukan lanjut. Illustrations tidak disimpan dalam data peribadi kau.</p><button class="danger outline" onclick="clearAll()">Delete ALL local data</button></div>`;
}


function showPackagePreview(id){
 let t=templates().find(x=>x.id===id);if(!t)return;
 modal(`<h3>${esc(t.name)}</h3><p class="small">${esc(t.subtitle||'Custom training')} · Pilih pakej pada mana-mana hari.</p>${t.ids.map((eid,i)=>{let ex=getEx(eid);return ex?`<div class="exercise-hero spaced">${imageTile(ex)}<div><b>${i+1}. ${esc(ex.name)}</b><div>${muscleTags(ex)}</div><div class="small">${ex.sets} sets × ${ex.lo}–${ex.hi} reps</div><button class="outline mini" onclick="showExerciseInfo('${esc(ex.id)}')">Reference ↗</button></div></div>`:''}).join('')}<button class="primary spaced" onclick="closeModal();startWorkout('${esc(t.id)}')">Start this package</button>`);
}
function showPlans(){modal(`<h3>Workout packages</h3><p class="small">Choose any day — ikut recovery kau, bukan tarikh tetap.</p>${templates().map(t=>`<div class="item"><div class="row"><b>${esc(t.name)}</b><div class="gap"><button class="outline" onclick="showPackagePreview('${esc(t.id)}')">Images</button><button onclick="closeModal();startWorkout('${esc(t.id)}')">Start</button>${db.templates.some(z=>z.id===t.id)?`<button class="danger" onclick="deleteTemplate('${esc(t.id)}')">Delete</button>`:''}</div></div><div class="small">${t.ids.map(id=>getEx(id)?.name||id).join(' • ')}</div></div>`).join('')}<button class="primary spaced" onclick="showNewTemplate()">+ Custom package</button>`)}
function workout(){let a=db.active;return `<div class="row"><h2>Workout</h2><button class="outline" onclick="showPlans()">Manage packages</button></div>${!a?`<div class="card"><h3>Choose workout A/B/C or Optional</h3><p class="small">Tak terikat hari. Klik Preview untuk tengok gambar setiap exercise.</p>${templates().map(t=>`<div class="item"><div class="row"><div><b>${esc(t.name)}</b><div class="small">${esc(t.subtitle||'Custom')} · ${t.ids.length} exercises</div></div><div class="gap"><button class="outline" onclick="showPackagePreview('${esc(t.id)}')">Preview</button><button class="primary" onclick="startWorkout('${esc(t.id)}')">Start</button></div></div></div>`).join('')}</div>`:`<div class="card"><div class="row"><div><h2>${esc(a.templateName)}</h2><div class="small">${dateText(a.date)} · ${a.exercises.length} exercises</div></div><button class="danger outline" onclick="cancelWorkout()">Discard</button></div><label>Workout date</label><input type="date" value="${esc(a.date)}" onchange="activeField('date',this.value)"><div class="notice spaced small">Each set: kg, reps, RIR. Dumbbells: berat sebelah tangan. Klik gambar untuk posisi latihan. Log disimpan automatik.</div>${a.exercises.map((e,i)=>exerciseEditor(e,i)).join('')}<button class="outline spaced" onclick="showAddExercise()">+ Add exercise</button><label>Workout notes</label><textarea rows="2" placeholder="Energy, pain, technique..." oninput="activeField('notes',this.value)">${esc(a.notes)}</textarea><div class="gap spaced"><button class="primary" onclick="finishWorkout()">✓ Finish & Save</button><button class="outline" onclick="save();toast('Draft saved locally')">Save draft</button></div></div>`}<div class="card"><h3>Strength progress</h3><p class="small">Semak tab Progress untuk graph kg, reps dan estimated 1RM. Alternatif workout disimpan sebagai exercise berbeza, supaya trend tak bercampur.</p></div>`}
function sessionMatchesCSV(s,ss){
 if(!ss.length||s.date!==ss[0].date||s.templateName!==(ss[0].package||'Imported workout'))return false;
 const a=s.exercises.flatMap(e=>e.sets.map((z,i)=>({exercise:getEx(e.exId)?.name||e.exId,kg:num(z.kg),reps:num(z.reps),rir:z.rir===null?'':String(z.rir)})));
 if(a.length!==ss.length)return false;
 return a.every((z,i)=>normalizeExerciseName(z.exercise)===normalizeExerciseName(ss[i].exercise)&&z.kg===num(ss[i].kg)&&z.reps===num(ss[i].reps)&&z.rir===String(ss[i].rir??''));
}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn));
render();
if(location.protocol.startsWith('http'))resolveImageReferences();
</script></body></html>
